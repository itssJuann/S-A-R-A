# Despliegue en Render con un clic (Blueprint).
# Crea el servicio web y la base de datos PostgreSQL, y los conecta solo.
services:
  - type: web
    name: sara
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    envVars:
      # La URL de la base la inyecta Render desde el recurso de abajo.
      - key: SARA_DATABASE_URL
        fromDatabase:
          name: sara-db
          property: connectionString
      # Clave de firma de los JWT: Render genera una distinta en cada despliegue.
      - key: SARA_SECRET_KEY
        generateValue: true
      # Carga los datos de demostración la primera vez que arranca.
      - key: SARA_SEMBRAR
        value: "1"
      - key: SARA_PERIODO
        value: "2026-2"

databases:
  - name: sara-db
    plan: free
    databaseName: sara
